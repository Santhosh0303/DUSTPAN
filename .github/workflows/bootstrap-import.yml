name: bootstrap-import

on:
  push:
    branches: ["import/dustpan-0.1.2"]
    paths: [".bootstrap_ready"]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Materialize uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/dustpan-source.b64
          base64 --decode /tmp/dustpan-source.b64 > /tmp/dustpan-source.zip
          mkdir -p /tmp/dustpan-import
          unzip -q /tmp/dustpan-source.zip -d /tmp/dustpan-import
          test -f /tmp/dustpan-import/dustpan/pyproject.toml
          test -f /tmp/dustpan-import/dustpan/.github/workflows/ci.yml
          rsync -a --delete --exclude='.git/' /tmp/dustpan-import/dustpan/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import Dustpan 0.1.2 source'
          git push origin HEAD:import/dustpan-0.1.2
