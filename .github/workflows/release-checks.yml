name: release-checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' pip-audit
      - run: python -m pip check
      - name: Audit resolved third-party dependencies
        run: python -m pip_audit --skip-editable --format json --output dependency-audit.json
      - name: Show dependency findings
        if: ${{ !cancelled() }}
        run: python -m json.tool dependency-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.6.0 setuptools==77.0.3 wheel==0.48.0
      - name: Compare two clean builds
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=1704067200
          export PYTHONHASHSEED=0
          export TZ=UTC
          mkdir -p /tmp/dustpan-build-a /tmp/dustpan-build-b
          git archive HEAD | tar -x -C /tmp/dustpan-build-a
          git archive HEAD | tar -x -C /tmp/dustpan-build-b
          python -m build --no-isolation /tmp/dustpan-build-a -o /tmp/dustpan-build-a/dist
          python -m build --no-isolation /tmp/dustpan-build-b -o /tmp/dustpan-build-b/dist
          for artifact in /tmp/dustpan-build-a/dist/*; do
            cmp "$artifact" "/tmp/dustpan-build-b/dist/$(basename "$artifact")"
          done
          sha256sum /tmp/dustpan-build-a/dist/* > reproducibility-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: reproducibility
          path: |
            reproducibility-sha256.txt
            /tmp/dustpan-build-a/dist/*
            /tmp/dustpan-build-b/dist/*
          if-no-files-found: error
