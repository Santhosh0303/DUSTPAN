# AUD-V1-017: GitHub Actions referenced by mutable major tags (@v4) resolve to
# whatever that tag currently points at, so the workflow's supply chain can
# change without any commit to this repository. The immutable form is a full
# commit SHA. Dependabot keeps pinned SHAs current so pinning does not mean
# going stale.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
